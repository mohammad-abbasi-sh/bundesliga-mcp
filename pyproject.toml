[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bundesliga-mcp"
version = "0.1.1"
description = "Unofficial read-only MCP server for German football — Bundesliga fixtures, live scores, tables and top scorers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
bundesliga-mcp = "bundesliga_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bundesliga_mcp"]
